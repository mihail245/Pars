<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Parser Demo</title>
</head>
<body>
<input id="url" placeholder="URL" style="width:400px">
<button onclick="parse()">Парсить</button>
<pre id="out"></pre>

<script>
async function parse() {
  const url = document.getElementById('url').value;
  const out = document.getElementById('out');
  try {
    // CORS заблокирует прямой запрос к чужому домену
    const res = await fetch(url);
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const items = [...doc.querySelectorAll('a')]
      .map(a => ({ text: a.textContent.trim(), href: a.href }))
      .filter(x => x.href);

    out.textContent = JSON.stringify(items.slice(0, 50), null, 2);
  } catch (e) {
    out.textContent = 'Ошибка: ' + e.message +
      '\nCORS блокирует прямые запросы из браузера. Нужен серверный прокси.';
  }
}
</script>
</body>
</html>

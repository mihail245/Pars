<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamHub — Медиатека</title>

<style>
:root {
    --bg: #0b0d11;
    --card: #151820;
    --card2: #1b1f28;
    --border: #292e38;
    --accent: #e50914;
    --accent-hover: #ff2631;
    --text: #fff;
    --muted: #9ca3af;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background:
        radial-gradient(
            circle at top,
            #191d27 0,
            #0b0d11 48%
        );
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

header {
    max-width: 1500px;
    margin: 0 auto 35px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo-icon {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border-radius: 13px;

    background: var(--accent);

    font-size: 21px;

    box-shadow:
        0 8px 25px rgba(229, 9, 20, .25);
}

.logo h1 {
    margin: 0;

    font-size: 25px;
    font-weight: 700;
}

.logo span {
    display: block;

    margin-top: 3px;

    color: var(--muted);
    font-size: 13px;
}


/* =========================
   GRID
========================= */

.grid {
    max-width: 1500px;
    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(400px, 1fr)
        );

    gap: 25px;
}


/* =========================
   CARD
========================= */

.card {
    overflow: hidden;

    background:
        rgba(21, 24, 32, .96);

    border:
        1px solid var(--border);

    border-radius: 18px;

    box-shadow:
        0 18px 50px rgba(0, 0, 0, .35);
}


/* =========================
   VIDEO
========================= */

.video-container {
    position: relative;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}

.video-container video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: #000;
}


/* =========================
   PLAYER CONTROLS
========================= */

.player-controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        55px 13px
        12px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.92)
        );

    opacity: 0;

    transition:
        opacity .2s ease;
}

.video-container:hover
.player-controls,

.video-container.controls-visible
.player-controls {
    opacity: 1;
}


/* =========================
   PROGRESS
========================= */

.progress-wrap {
    height: 18px;

    display: flex;
    align-items: center;

    cursor: pointer;
}

.progress {
    width: 100%;

    height: 5px;

    appearance: none;

    border: 0;
    border-radius: 10px;

    background: #555;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border: 0;
    border-radius: 50%;

    background:
        var(--accent);

    cursor: pointer;
}

.progress::-moz-range-thumb {
    width: 13px;
    height: 13px;

    border: 0;
    border-radius: 50%;

    background:
        var(--accent);

    cursor: pointer;
}


/* =========================
   CONTROL ROW
========================= */

.controls-row {
    display: flex;
    align-items: center;

    gap: 5px;
}

.control-btn {
    width: 38px;
    height: 38px;

    flex: 0 0 auto;

    border: 0;
    border-radius: 9px;

    background: transparent;

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .1s ease;
}

.control-btn:hover {
    background:
        rgba(255,255,255,.13);
}

.control-btn:active {
    transform: scale(.94);
}

.time {
    margin-right: auto;

    color: #ddd;

    font-size: 12px;

    white-space: nowrap;
}


/* =========================
   VOLUME
========================= */

.volume {
    width: 75px;

    accent-color:
        var(--accent);
}


/* =========================
   SETTINGS
========================= */

.settings {
    position: relative;
}

.settings-menu {
    position: absolute;

    right: 0;
    bottom: 47px;

    width: 195px;

    padding: 8px;

    background:
        #171a20;

    border:
        1px solid #30343d;

    border-radius: 12px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.6);

    display: none;

    z-index: 100;
}

.settings-menu.open {
    display: block;
}

.settings-title {
    padding:
        7px 9px;

    color:
        var(--muted);

    font-size: 11px;

    text-transform:
        uppercase;
}

.speed-option,
.quality-option {
    width: 100%;

    padding: 9px;

    border: 0;

    border-radius: 7px;

    background:
        transparent;

    color:
        white;

    text-align: left;

    cursor: pointer;
}

.speed-option:hover,
.quality-option:hover {
    background:
        rgba(255,255,255,.1);
}

.speed-option.active,
.quality-option.active {
    background:
        rgba(229,9,20,.18);

    color:
        #ff6268;
}


/* =========================
   CARD BODY
========================= */

.card-body {
    padding: 17px;
}

.card-title {
    margin-bottom: 14px;

    color: var(--text);

    font-size: 15px;
    font-weight: 600;

    line-height: 1.45;

    word-break: break-word;
}


/* =========================
   TIMESTAMPS
========================= */

.timestamps-section {
    max-height: 125px;

    display: flex;
    flex-wrap: wrap;

    gap: 6px;

    overflow-y: auto;

    padding-right: 4px;
}

.timestamp-badge {
    padding:
        6px 9px;

    border:
        1px solid
        rgba(229,9,20,.35);

    border-radius: 7px;

    background:
        rgba(229,9,20,.12);

    color:
        #ff6268;

    font-size: 11px;

    cursor: pointer;

    transition:
        .15s;
}

.timestamp-badge:hover {
    background:
        var(--accent);

    color:
        white;
}

.no-timestamps {
    color:
        var(--muted);

    font-size:
        13px;
}


/* =========================
   FOOTER
========================= */

.card-footer {
    margin-top: 15px;

    padding-top: 13px;

    border-top:
        1px solid
        var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.source {
    color:
        #38bdf8;

    font-size:
        13px;

    text-decoration:
        none;
}

.source:hover {
    text-decoration:
        underline;
}

.duration {
    color:
        var(--muted);

    font-size:
        12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {

    }

    header {
        margin-bottom: 22px;

        display: none;
    }

    .control-btn {
        width: 34px;
        height: 34px;
    }

    .time {
        font-size: 11px;
    }
}
</style>

/* ==========================================================
   TIME FORMAT
========================================================== */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds)
    ) {
        return "00:00";
    }


    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0")
            + ":"
            +
            String(minutes).padStart(2, "0")
            + ":"
            +
            String(secs).padStart(2, "0")
        );
    }


    return (
        String(minutes).padStart(2, "0")
        + ":"
        +
        String(secs).padStart(2, "0")
    );
}


/* ==========================================================
   TITLE
========================================================== */

function getTitle(
    url,
    index
) {

    try {

        const parts =
            url.split("/");

        const last =
            parts[parts.length - 1];


        if (!last) {
            return `Видео #${index + 1}`;
        }


        const name =
            last
                .split("-")
                .slice(0, -1)
                .join(" ");


        return decodeURIComponent(name)
            .replace(/-/g, " ")
            .trim()
            ||
            `Видео #${index + 1}`;

    }

    catch {

        return `Видео #${index + 1}`;

    }
}

        );

    menu.className =
        "settings-menu";


    /* SPEED */

    const speedTitle =
        document.createElement(
            "div"
        );

    speedTitle.className =
        "settings-title";

    speedTitle.textContent =
        "Скорость";


    menu.appendChild(
        speedTitle
    );


    const speeds = [
        0.25,
        0.5,
        0.75,
        1,
        1.25,
        1.5,
        1.75,
        2
    ];


    speeds.forEach(
        speed => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";

            button.className =
                "speed-option";


            button.textContent =
                speed === 1
                    ? "1× — обычная"
                    : `${speed}×`;


            if (speed === 1) {
                button.classList.add(
                    "active"
                );
            }


            button.addEventListener(
                "click",
                () => {

                    video.playbackRate =
                        speed;


                    menu
                        .querySelectorAll(
                            ".speed-option"
                        )
                        .forEach(
                            element =>
                                element.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );

                }
            );


            menu.appendChild(
                button
            );

        }
    );


    /* QUALITY */

    const qualityTitle =
        document.createElement(
            "div"
        );

    qualityTitle.className =
        "settings-title";

    qualityTitle.textContent =
        "Качество";


    menu.appendChild(
        qualityTitle
    );


    const quality =
        document.createElement(
            "button"
        );

    quality.type =
        "button";

    quality.className =
        "quality-option active";

    quality.textContent =
        "Авто";


    quality.addEventListener(
        "click",
        () => {

            /*
             * Один MP4-файл не содержит
             * нескольких вариантов качества.
             *
             * Для настоящего переключения
             * 1080p / 720p / 480p нужны
             * отдельные URL.
             */

            quality.classList.add(
                "active"
            );

        }
    );


    menu.appendChild(
        quality
    );


    settings.appendChild(
        settingsButton
    );

    settings.appendChild(
        menu
    );


    /* ------------------------------------------------------
       PIP
    ------------------------------------------------------ */

    const pip =
        document.createElement(
            "button"
        );

    pip.type =
        "button";

    pip.className =
        "control-btn";

    pip.textContent =
        "▣";

    pip.title =
        "Картинка в картинке";


    /* ------------------------------------------------------
       FULLSCREEN
    ------------------------------------------------------ */

    const fullscreen =
        document.createElement(
            "button"
        );

    fullscreen.type =
        "button";

    fullscreen.className =
        "control-btn";

    fullscreen.textContent =
        "⛶";

    fullscreen.title =
        "Полный экран";


    /* ------------------------------------------------------
       APPEND CONTROLS
    ------------------------------------------------------ */

    row.appendChild(
        back
    );

    row.appendChild(
        play
    );

    row.appendChild(
        forward
    );

    row.appendChild(
        time
    );

    row.appendChild(
        volume
    );

    row.appendChild(
        pip
    );

    row.appendChild(
        settings
    );

    row.appendChild(
        fullscreen
    );


    controls.appendChild(
        progressWrap
    );

    controls.appendChild(
        row
    );


    container.appendChild(
        video
    );

    container.appendChild(
        controls
    );


    /* ======================================================
       PLAY / PAUSE
    ====================================================== */

    play.addEventListener(
        "click",
        () => {

            if (video.paused) {

                video.play();

            } else {

                video.pause();

            }

        }
    );


    video.addEventListener(
        "play",
        () => {

            play.textContent =
                "❚❚";

            play.title =
                "Пауза";

        }
    );


    video.addEventListener(
        "pause",
        () => {

            play.textContent =
                "▶";

            play.title =
                "Воспроизвести";

        }
    );


    /* ======================================================
       SEEK
    ====================================================== */

    back.addEventListener(
        "click",
        () => {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 10
                );

        }
    );


    forward.addEventListener(
        "click",
        () => {

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 10
                );

        }
    );


    /* ======================================================
       PROGRESS
    ====================================================== */

    video.addEventListener(
        "timeupdate",
        () => {

            if (video.duration) {

                progress.value =
                    (
                        video.currentTime /
                        video.duration
                    ) * 100;

            }


            time.textContent =
                formatTime(
                    video.currentTime
                )
                +
                " / "
                +
                formatTime(
                    video.duration
                );

        }
    );


    progress.addEventListener(
        "input",
        () => {

            if (video.duration) {

                video.currentTime =
                    (
                        Number(
                            progress.value
                        ) / 100
                    )
                    *
                    video.duration;

            }

        }
    );


    /* ======================================================
       VOLUME
    ====================================================== */

    volume.addEventListener(
        "input",
        () => {

            video.volume =
                Number(
                    volume.value
                );

        }
    );


    /* ======================================================
       SETTINGS
    ====================================================== */

    settingsButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            menu.classList.toggle(
                "open"
            );

        }
    );


    menu.addEventListener(
        "click",
        event => {

            event.stopPropagation();

        }
    );


    document.addEventListener(
        "click",
        () => {

            menu.classList.remove(
                "open"
            );

        }
    );


    /* ======================================================
       FULLSCREEN
    ====================================================== */

    fullscreen.addEventListener(
        "click",
        async () => {

            try {

                if (
                    document.fullscreenElement
                ) {

                    await document.exitFullscreen();

                } else {

                    await container.requestFullscreen();

                }

            } catch (error) {

                console.log(
                    "Fullscreen error:",
                    error
                );

            }

        }
    );


    /* ======================================================
       PICTURE IN PICTURE
    ====================================================== */

    pip.addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.pictureInPictureEnabled
                ) {
                    return;
                }


                if (
                    document.pictureInPictureElement
                ) {

                    await
                        document.exitPictureInPicture();

                } else {

                    await
                        video.requestPictureInPicture();

                }

            } catch (error) {

                console.log(
                    "PiP error:",
                    error
                );

            }

        }
    );


    /* ======================================================
       AUTO HIDE CONTROLS
    ====================================================== */

    let hideTimer;


    function showControls() {

        container.classList.add(
            "controls-visible"
        );


        clearTimeout(
            hideTimer
        );


        hideTimer =
            setTimeout(
                () => {

                    if (
                        !video.paused
                    ) {

                        container.classList.remove(
                            "controls-visible"
                        );

                    }

                },
                2500
            );

    }


    container.addEventListener(
        "mousemove",
        showControls
    );


    container.addEventListener(
        "touchstart",
        showControls
    );


    /* ======================================================
       KEYBOARD
    ====================================================== */

    container.tabIndex =
        0;


    container.addEventListener(
        "keydown",
        event => {

            if (
                event.target.tagName ===
                    "INPUT"
                ||
                event.target.tagName ===
                    "BUTTON"
            ) {
                return;
            }


            switch (
                event.key
            ) {

                case " ":

                    event.preventDefault();

                    if (
                        video.paused
                    ) {

                        video.play();

                    } else {

                        video.pause();

                    }

                    break;


                case "ArrowLeft":

                    video.currentTime =
                        Math.max(
                            0,
                            video.currentTime - 5
                        );

                    break;


                case "ArrowRight":

                    video.currentTime =
                        Math.min(
                            video.duration ||
                                Infinity,
                            video.currentTime + 5
                        );

                    break;


                case "ArrowUp":

                    video.volume =
                        Math.min(
                            1,
                            video.volume + .1
                        );

                    volume.value =
                        video.volume;

                    break;


                case "ArrowDown":

                    video.volume =
                        Math.max(
                            0,
                            video.volume - .1
                        );

                    volume.value =
                        video.volume;

                    break;


                case "m":

                case "M":

                    video.muted =
                        !video.muted;

                    break;


                case "f":

                case "F":

                    fullscreen.click();

                    break;

            }

        }
    );


    return container;
}


/* ==========================================================
   CREATE CARDS
========================================================== */

videos.forEach(
    (item, index) => {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "card";


        const player =
            createPlayer(
                item
            );


        card.appendChild(
            player
        );


        const body =
            document.createElement(
                "div"
            );

        body.className =
            "card-body";


        /* TITLE */

        const title =
            document.createElement(
                "div"
            );

        title.className =
            "card-title";

        title.textContent =
            getTitle(
                item.page,
                index
            );


        body.appendChild(
            title
        );


        /* ==================================================
           TIMESTAMPS
        ================================================== */

        if (
            Array.isArray(
                item.timestamps
            )
            &&
            item.timestamps.length > 0
        ) {

            const timestamps =
                document.createElement(
                    "div"
                );

            timestamps.className =
                "timestamps-section";


            item.timestamps.forEach(
                ts => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.type =
                        "button";

                    button.className =
                        "timestamp-badge";


                    button.textContent =
                        `${ts.category} (${ts.time})`;


                    button.addEventListener(
                        "click",
                        () => {

                            const video =
                                player.querySelector(
                                    "video"
                                );


                            const parts =
                                ts.time
                                    .split(":")
                                    .map(Number);


                            let seconds = 0;


                            if (
                                parts.length === 2
                            ) {

                                seconds =
                                    parts[0] * 60 +
                                    parts[1];

                            }


                            if (
                                parts.length === 3
                            ) {

                                seconds =
                                    parts[0] * 3600 +
                                    parts[1] * 60 +
                                    parts[2];

                            }


                            if (
                                Number.isFinite(
                                    seconds
                                )
                            ) {

                                video.currentTime =
                                    seconds;

                                video.play();

                            }

                        }
                    );


                    timestamps.appendChild(
                        button
                    );

                }
            );


            body.appendChild(
                timestamps
            );

        } else {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "no-timestamps";

            empty.textContent =
                "Таймкоды отсутствуют";


            body.appendChild(
                empty
            );

        }


        /* ==================================================
           FOOTER
        ================================================== */

        const footer =
            document.createElement(
                "div"
            );

        footer.className =
            "card-footer";


        const source =
            document.createElement(
                "a"
            );

        source.className =
            "source";

        source.href =
            item.page;

        source.target =
            "_blank";

        source.rel =
            "noopener noreferrer";

        source.textContent =
            "Источник ↗";


        const duration =
            document.createElement(
                "span"
            );

        duration.className =
            "duration";

        duration.textContent =
            "Загрузка...";


        const video =
            player.querySelector(
                "video"
            );


        video.addEventListener(
            "loadedmetadata",
            () => {

                duration.textContent =
                    formatTime(
                        video.duration
                    );

            }
        );


        footer.appendChild(
            source
        );

        footer.appendChild(
            duration
        );


        body.appendChild(
            footer
        );

        card.appendChild(
            body
        );

        grid.appendChild(
            card
        );

    }
);

</script>

</body>
</html>

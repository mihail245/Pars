    margin: 0;
  }

  .grid {

    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 25px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }

  .video-container {

    width: 100%;
    padding-top: 56.25%;
    background: #000;
  }

  .card video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    outline: none;
  }

  .card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-grow: 1;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    line-height: 1.4;
    word-break: break-word;
  }

  .timestamps-section {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .timestamp-badge {

    color: #ff4d4f;
    border: 1px solid rgba(229, 9, 20, 0.3);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .timestamp-badge:hover {
    background: var(--accent-color);
    color: #fff;
  }

  .no-timestamps {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
  }

  .card-footer a {
    color: #38bdf8;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }

  .card-footer a:hover {

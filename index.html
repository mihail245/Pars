<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Local Video Player</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f0f;
    color: #f1f1f1;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #fff;
    margin-bottom: 30px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #1f1f1f;
    border: 1px solid #333;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .card video {
    width: 100%;
    height: 180px;
    background: #000;
    object-fit: cover;
    outline: none;
  }
  .card-content {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-grow: 1;
  }
  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: #aaa;
    word-break: break-all;
    flex-grow: 1;
  }
  .card a {
    color: #3ea6ff;
    text-decoration: none;
    font-size: 13px;
    align-self: flex-start;
  }
  .card a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<h1>Моя медиатека</h1>
<div class="grid" id="video-grid"></div>

<script>
  // Данные, полученные из вашего парсера
  const videos = [
    {
      "page": "https://sex-studentki.city/video/nu-eto-prajm-srazu-dvuh-aziatok-trahaju-i-na-lica-im-konchaju-247118",
      "video_url": "https://cs23.vps-vids.com/vids80087/sexstud28652.mp4?hash=1a9518961a35fa5224e8bbaddc63e3e6&expires=1790891003&ip=85.190.102.209"
    },
    {
      "page": "https://sex-studentki.city/video/u-nih-vse-stabil-no-on-ee-ebet-so-strast-ju-a-ona-konchaet-sil-no-80312",
      "video_url": "https://cs5.vps-vids.com/vids974241/sexstud25382.mp4?hash=a83530a8b67a197c5010fbd0e6c3a906&expires=1790891007&ip=85.190.102.209"
    },
    {
      "page": "https://sex-studentki.city/video/milaja-takaja-hochetsja-v-nee-vstavit-i-posmotret-kak-ona-konchaet-361135",
      "video_url": "https://cs17.vps-vids.com/vids38561/sexstud28901.mp4?hash=5d485107ec945adc927108ad4c4ada5c&expires=1790891012&ip=85.190.102.209"
    },
    {
      "page": "https://sex-studentki.city/video/ja-zh-ne-znala-chto-drug-trahaet-do-orgazma-davno-by-emu-davala-71217",
      "video_url": "https://cs2.vps-vids.com/vids440666/sexstud26550.mp4?hash=47aad8f7e8bc2749e212da779442be5f&expires=1790891016&ip=85.190.102.209"
    },
    {
      "page": "https://sex-studentki.city/video/vot-chto-vidit-devushka-kogda-ty-ee-ebesh-63148",
      "video_url": "https://cs11.vps-vids.com/vids400665/sexstud22100.mp4?hash=c1d55bf33ad89bee4630b82f347cf23a&expires=1790891021&ip=85.190.102.209"
    }
  ];

  const grid = document.getElementById('video-grid');

  videos.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';

    // Извлекаем короткое имя для отображения из URL страницы
    const urlParts = item.page.split('/');
    const videoName = urlParts[urlParts.length - 1] || `Видео #${index + 1}`;

    card.innerHTML = `
      <video controls preload="metadata">
        <source src="${item.video_url}" type="video/mp4">
        Ваш браузер не поддерживает элемент video.
      </video>
      <div class="card-content">
        <div class="card-title">${videoName}</div>
        <a href="${item.page}" target="_blank">Открыть оригинал сайта ↗</a>
      </div>
    `;

    grid.appendChild(card);
  });
</script>

</body>
</html>
